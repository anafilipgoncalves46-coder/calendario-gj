<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendário - Utilizador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="user">
    <div id="authScreen" class="auth-screen">
      <div class="auth-card">
        <p class="auth-eyebrow">Acesso</p>
        <h2>Entrar no calendário</h2>

        <form id="userLoginForm" class="login-form">
          <label class="auth-field" for="userName">
            <span>Nome</span>
            <input id="userName" type="text" autocomplete="off" placeholder="Digite o seu nome" required />
          </label>

          <div class="auth-field">
            <span>Grupos aos quais pertence</span>
            <div class="group-checkboxes">
              <label><input type="checkbox" name="group" value="logistica" /> Logística</label>
              <label><input type="checkbox" name="group" value="musica" /> Música</label>
              <label><input type="checkbox" name="group" value="comunicacao" /> Comunicação</label>
              <label><input type="checkbox" name="group" value="acao-social" /> Ação Social</label>
              <label><input type="checkbox" name="group" value="retiro" /> Retiro</label>
              <label><input type="checkbox" name="group" value="grupo-reunioes" /> Grupo de Reuniões</label>
            </div>
          </div>

          <div id="taskPreview" class="task-preview hidden">
            <p class="task-preview-title">Tarefas agendadas para estes grupos</p>
            <ul id="taskPreviewList" class="task-preview-list"></ul>
          </div>

          <label id="reuniaoField" class="auth-field hidden" for="reuniaoNumero">
            <span>Número do grupo de reuniões</span>
            <select id="reuniaoNumero">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </label>

          <button type="submit" class="auth-submit">Entrar</button>
        </form>
      </div>
    </div>

    <div id="appShell" class="app-shell user-app-shell hidden">
      <div class="calendar-app">
        <div class="calendar-brand">
          <img src="logo-grupo.png" alt="Logo do grupo" />
        </div>
        <header class="calendar-header">
          <button id="prevMonth" class="nav-btn" aria-label="Mês anterior">&#8592;</button>
          <h1 id="monthLabel">Mês</h1>
          <div class="calendar-month-actions">
            <button id="todayBtn" class="today-btn">Hoje</button>
            <button id="nextMonth" class="nav-btn" aria-label="Próximo mês">&#8594;</button>
          </div>
        </header>

        <div class="user-account-toolbar">
          <span id="userBadge" class="user-badge">Utilizador</span>
          <button id="logoutBtn" class="logout-btn">Sair</button>
        </div>

        <div class="user-dashboard-layout">
          <main class="user-calendar-column">
            <div class="weekdays" aria-label="Dias da semana">
              <span>Seg</span>
              <span>Ter</span>
              <span>Qua</span>
              <span>Qui</span>
              <span>Sex</span>
              <span>Sáb</span>
              <span>Dom</span>
            </div>

            <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>

            <section class="selected-date-panel">
              <p class="panel-label">Selecionado</p>
              <h2 id="selectedDateLabel">Data</h2>
              <p id="dateDescription">Escolha uma data.</p>

              <ul id="eventList" class="event-list" aria-live="polite"></ul>
            </section>
          </main>

          <aside class="user-dashboard-sidebar" aria-label="Resumo">
            <section id="userTasksPanel" class="user-tasks-panel hidden">
              <div class="user-tasks-header">
                <button type="button" class="user-tasks-open" data-activity-list="tasks" aria-haspopup="dialog" aria-controls="activitiesDialog">
                  <span>
                    <span class="user-tasks-title">As minhas tarefas</span>
                    <small>Próximos 365 dias · Ver lista completa</small>
                  </span>
                  <span class="user-tasks-arrow" aria-hidden="true">↗</span>
                </button>
              </div>
              <ul id="userTasksList" class="user-tasks-list"></ul>
            </section>

            <section id="upcomingEventsPanel" class="user-tasks-panel hidden">
              <div class="user-tasks-header">
                <button type="button" class="user-tasks-open" data-activity-list="events" aria-haspopup="dialog" aria-controls="activitiesDialog">
                  <span>
                    <span class="user-tasks-title">Próximos eventos</span>
                    <small>Próximos 365 dias · Ver lista completa</small>
                  </span>
                  <span class="user-tasks-arrow" aria-hidden="true">↗</span>
                </button>
              </div>
              <ul id="upcomingEventsList" class="user-tasks-list"></ul>
            </section>
          </aside>
        </div>
      </div>
    </div>

    <dialog id="activitiesDialog" class="activities-dialog" aria-labelledby="activitiesDialogTitle">
      <div class="activities-dialog-content">
        <header class="activities-dialog-header">
          <h2 id="activitiesDialogTitle"></h2>
          <button id="closeActivitiesDialog" type="button" class="activities-dialog-close" aria-label="Fechar">×</button>
        </header>
        <p id="activitiesDialogDescription"></p>
        <ul id="activitiesDialogList" class="user-tasks-list activities-dialog-list"></ul>
      </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
  </body>
</html>
